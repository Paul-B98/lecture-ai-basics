[project]
name = "ai_basics"
description = "Lecture notes on ai and machine learning with python"
version = "1.0.0"
license = "MIT"
authors = [
    { name = "Paul-B98", email = "115164840+Paul-B98@users.noreply.github.com" }
]
maintainers = [
    { name = "Paul-B98", email = "115164840+Paul-B98@users.noreply.github.com" }
]
readme = "README.md"
keywords = ["Lecture", "Notes", "AI", "Machine Learning", "Python"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = [
    "dask[complete]>=2026.7.1",
    "duckdb>=1.5.5",
    "jupyterlab>=4.6.3",
    "lightgbm>=4.7.0",
    "mapie>=1.5.0",
    "matplotlib>=3.10.0",
    "numpy>=2.1.3",
    "pandas>=2.3.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "ty>=0.0.72",
    "xgboost>=3.4.1",
]

[project.urls]
homepage = "https://github.com/Paul-B98/lecture-ai-basics"
repository = "https://github.com/Paul-B98/lecture-ai-basics"
changelog = "https://github.com/Paul-B98/lecture-ai-basics/releases"
issues = "https://github.com/Paul-B98/lecture-ai-basics/issues"
documentation = "https://github.com/Paul-B98/lecture-ai-basics/wiki"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.16.2",
]

[tool.uv]
exclude-newer = "P7D"
